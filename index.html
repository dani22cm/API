<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Studio Ghibli API</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f5f5f5;
      }
      .film-card {
        cursor: pointer;
        transition: transform 0.2s;
        margin-bottom: 20px;
        width: 500px;
      }
      .film-card:hover {
        transform: scale(1.03);
      }
      .film-card img {
        width: 500px;
        height: 250px;
        object-fit: contain;
        border-radius: 5px;
        background-color: #fff;
        display: block;
        margin: 0 auto;
      }
      .film-title {
        text-align: center;
        margin-top: 10px;
        font-weight: bold;
      }
      .pagination {
        justify-content: center;
        margin-top: 20px;
      }
      .pagination .page-item .page-link {
        color: #333;
        border-radius: 5px;
        border: 1px solid #ccc;
        margin: 0 2px;
        padding: 5px 10px;
        transition: background 0.3s, color 0.3s;
      }
      .pagination .page-item.active .page-link {
        background-color: #007bff;
        color: white;
        border-color: #007bff;
      }
      .pagination .page-item .page-link:hover {
        background-color: #e2e6ea;
        color: #007bff;
      }
      @media (max-width: 992px) {
        .film-card {
          width: 90%;
          max-width: 500px;
        }
      }
      @media (max-width: 576px) {
        .film-card {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container mt-4 d-flex flex-wrap justify-content-center">
      <input
        type="text"
        id="buscador"
        class="form-control mb-4 w-100"
        placeholder="Buscar película..."
      />
      <div class="row justify-content-center" id="filmList"></div>
      <nav><ul class="pagination" id="paginacion"></ul></nav>
    </div>

    <div class="modal fade" id="modalDetalle" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalTitulo"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body" id="modalContenido"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const filmList = document.getElementById("filmList"),
        buscador = document.getElementById("buscador"),
        paginacion = document.getElementById("paginacion");

      let films = [],
        filteredFilms = [],
        currentPage = 1,
        filmsPerPage = 12;

      const cargarPeliculas = async () => {
        try {
          films = await (
            await fetch("https://ghibliapi.vercel.app/films")
          ).json();
          filteredFilms = films;
          mostrarPagina(1);
        } catch {
          filmList.innerHTML = `<div class="col-12 text-center text-danger">No se pudieron cargar las películas.</div>`;
        }
      };

      const mostrarPagina = (pagina) => {
        currentPage = pagina;
        filmList.innerHTML = "";
        filteredFilms
          .slice((pagina - 1) * filmsPerPage, pagina * filmsPerPage)
          .forEach((film) => {
            const div = document.createElement("div");
            div.className = "col-md-4 d-flex justify-content-center mb-4";
            div.innerHTML = `
            <div class="film-card">
              <img src="${film.image}" alt="${film.title}" loading="lazy">
              <div class="film-title">${film.title}</div>
            </div>
          `;
            div
              .querySelector(".film-card")
              .addEventListener("click", () => mostrarModal(film));
            filmList.appendChild(div);
          });
        generarPaginacion();
      };

      const generarPaginacion = () => {
        paginacion.innerHTML = "";
        const totalPaginas = Math.ceil(filteredFilms.length / filmsPerPage);
        const crearBoton = (text, disabled, action) => {
          const li = document.createElement("li");
          li.className = "page-item" + (disabled ? " disabled" : "");
          const a = document.createElement("a");
          a.className = "page-link";
          a.href = "#";
          a.textContent = text;
          if (!disabled)
            a.addEventListener("click", (e) => {
              e.preventDefault();
              action();
            });
          li.appendChild(a);
          paginacion.appendChild(li);
        };
        crearBoton("Anterior", currentPage === 1, () =>
          mostrarPagina(currentPage - 1)
        );
        for (let i = 1; i <= totalPaginas; i++) {
          const li = document.createElement("li");
          li.className = "page-item" + (i === currentPage ? " active" : "");
          const a = document.createElement("a");
          a.className = "page-link";
          a.href = "#";
          a.textContent = i;
          a.addEventListener("click", (e) => {
            e.preventDefault();
            mostrarPagina(i);
          });
          li.appendChild(a);
          paginacion.appendChild(li);
        }
        crearBoton("Siguiente", currentPage === totalPaginas, () =>
          mostrarPagina(currentPage + 1)
        );
      };

      buscador.addEventListener("input", () => {
        const termino = buscador.value.toLowerCase();
        filteredFilms = films.filter((f) =>
          f.title.toLowerCase().includes(termino)
        );
        mostrarPagina(1);
      });

      const mostrarModal = (film) => {
        document.getElementById("modalTitulo").textContent = film.title;
        document.getElementById("modalContenido").innerHTML = `
        <img src="${film.movie_banner}" alt="${film.title}" class="img-fluid rounded mb-3">
        <p><strong>Director:</strong> ${film.director}</p>
        <p><strong>Productor:</strong> ${film.producer}</p>
        <p><strong>Año:</strong> ${film.release_date}</p>
        <p><strong>Puntuación:</strong> ${film.rt_score}</p>
        <p>${film.description}</p>
      `;
        new bootstrap.Modal(document.getElementById("modalDetalle")).show();
      };

      cargarPeliculas();
    </script>
  </body>
</html>
